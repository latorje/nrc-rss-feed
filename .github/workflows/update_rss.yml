name: Oppdater NRC RSS Feed

on:
  schedule:
    - cron: '0 * * * *'   # NYTT: Kjører nå hver eneste time
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Hent koden
      uses: actions/checkout@v4

    - name: Sett opp Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installer avhengigheter
      run: pip install -r requirements.txt

    - name: Kjør scraperen
      run: python scraper.py

    - name: Lagre og push rss.xml
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add rss.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisk oppdatering av RSS-feed" && git pull --rebase origin main && git push)
